<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d32f2f">
  <script>
    // Applique le thème choisi avant l'affichage, pour éviter un flash.
    try { const t = localStorage.getItem('planning-shifts:theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <title>Planning Shifts</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Shifts">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <dialog id="dlg"></dialog>
  <div id="toast" role="status" hidden></div>
  <input id="file" type="file" hidden>
  <script type="module" src="app.js"></script>
</body>
</html>
